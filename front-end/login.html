<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión - Agua Vida</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/style/global.css">
  <link rel="stylesheet" href="/style/auth.css">
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
      <a class="navbar-brand" href="/">
        <i class="fas fa-water"></i> <strong>Agua Vida</strong>
      </a>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="auth-container">
    <div class="container">
      <div class="row align-items-center min-vh-100">
        <!-- Left Side - Image -->
        <div class="col-lg-6 d-none d-lg-flex justify-content-center align-items-center">
          <div class="auth-image">
            <i class="fas fa-sign-in-alt"></i>
            <h2>¡Bienvenido!</h2>
            <p>Accede a tu cuenta para reportar y monitorear problemas de agua</p>
          </div>
        </div>

        <!-- Right Side - Form -->
        <div class="col-lg-6">
          <div class="auth-card">
            <div class="auth-header">
              <h1>Iniciar Sesión</h1>
              <p>Accede a tu cuenta</p>
            </div>

            <form id="loginForm" class="auth-form">
              <!-- Email -->
              <div class="form-group">
                <label for="email" class="form-label">
                  <i class="fas fa-envelope"></i> Correo Electrónico
                </label>
                <input 
                  type="email" 
                  id="email" 
                  class="form-control" 
                  placeholder="tu@email.com"
                  required
                >
              </div>

              <!-- Password -->
              <div class="form-group">
                <label for="password" class="form-label">
                  <i class="fas fa-lock"></i> Contraseña
                </label>
                <input 
                  type="password" 
                  id="password" 
                  class="form-control" 
                  placeholder="••••••••"
                  required
                >
              </div>

              <!-- Remember & Forgot -->
              <div class="row mb-3">
                <div class="col-6">
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="remember">
                    <label class="form-check-label" for="remember">
                      Recuérdame
                    </label>
                  </div>
                </div>
                <div class="col-6 text-end">
                  <a href="#" class="forgot-link">¿Olvidaste tu contraseña?</a>
                </div>
              </div>

              <!-- Submit Button -->
              <button type="submit" class="btn btn-primary w-100 py-3 mb-3">
                <i class="fas fa-sign-in-alt"></i> Iniciar Sesión
              </button>

              <!-- Divider -->
              <div class="divider mb-3">
                <span>O continúa con</span>
              </div>

              <!-- Social Buttons -->
              <div class="d-grid gap-2">
                <button type="button" class="btn btn-outline-secondary">
                  <i class="fab fa-google"></i> Google
                </button>
                <button type="button" class="btn btn-outline-secondary">
                  <i class="fab fa-facebook"></i> Facebook
                </button>
              </div>
            </form>

            <!-- Register Link -->
            <div class="auth-footer text-center mt-4">
              <p>¿No tienes cuenta? <a href="register.html">Regístrate aquí</a></p>
            </div>

            <!-- Alert Messages -->
            <div id="alertMessage" class="alert alert-dismissible fade" role="alert" style="display: none;">
              <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
              <span id="alertText"></span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="footer py-4">
    <div class="container">
      <div class="text-center">
        <p>&copy; 2025 Agua Vida. Todos los derechos reservados.</p>
      </div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
