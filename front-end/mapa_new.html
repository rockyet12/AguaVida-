<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapa en Vivo - Agua Vida</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="/style/global.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    .navbar {
      z-index: 1000;
    }
    #map {
      position: fixed;
      top: 60px;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: calc(100vh - 60px);
    }
    .map-controls {
      position: fixed;
      top: 80px;
      right: 20px;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      padding: 10px;
      z-index: 999;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .legend-box {
      position: fixed;
      bottom: 20px;
      left: 20px;
      background: white;
      border-radius: 8px;
      padding: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      z-index: 999;
      max-width: 300px;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }
    .legend-item:last-child {
      margin-bottom: 0;
    }
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="/">
        <i class="fas fa-water"></i> <strong>Agua Vida</strong> - Mapa en Vivo
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" href="/">Inicio</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/reportar.html">Reportar</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/perfil.html">Mi Perfil</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#" onclick="logout()">Salir</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Mapa -->
  <div id="map"></div>

  <!-- Controles del mapa -->
  <div class="map-controls">
    <button class="btn btn-sm btn-primary" id="btnRefresh" title="Actualizar reportes">
      <i class="fas fa-sync"></i>
    </button>
    <button class="btn btn-sm btn-outline-secondary" id="btnClear" title="Limpiar filtros">
      <i class="fas fa-eraser"></i>
    </button>
    <button class="btn btn-sm btn-outline-secondary" id="btnCenter" title="Centrar mapa">
      <i class="fas fa-crosshairs"></i>
    </button>
  </div>

  <!-- Leyenda -->
  <div class="legend-box">
    <h6 class="mb-3">
      <i class="fas fa-layer-group"></i> Leyenda
    </h6>
    
    <div class="legend-item">
      <span class="badge bg-danger" style="width: 20px; height: 20px; display: flex; align-items: center; justify-content: center;">
        <i class="fas fa-exclamation" style="font-size: 10px; color: white;"></i>
      </span>
      <span>Crítico</span>
    </div>

    <div class="legend-item">
      <span class="badge bg-warning" style="width: 20px; height: 20px; display: flex; align-items: center; justify-content: center;">
        <i class="fas fa-check" style="font-size: 10px; color: white;"></i>
      </span>
      <span>Medio</span>
    </div>

    <div class="legend-item">
      <span class="badge bg-info" style="width: 20px; height: 20px; display: flex; align-items: center; justify-content: center;">
        <i class="fas fa-info" style="font-size: 10px; color: white;"></i>
      </span>
      <span>Leve</span>
    </div>

    <hr style="margin: 10px 0;">
    
    <div style="font-size: 12px;">
      <strong id="reportCount">0</strong> reportes activos
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    // Inicializar mapa básico
    let map = L.map('map').setView([40, -3], 6);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors',
      maxZoom: 19
    }).addTo(map);

    // Cargar reportes desde API
    async function cargarReportes() {
      try {
        const response = await fetch('http://localhost:5000/api/reportes');
        const reportes = await response.json();
        
        // Limpiar marcadores anteriores
        map.eachLayer(layer => {
          if (layer instanceof L.Marker) layer.remove();
        });

        // Agregar nuevos marcadores
        reportes.forEach(reporte => {
          const color = reporte.gravedad === 'critico' ? 'danger' : 
                       reporte.gravedad === 'medio' ? 'warning' : 'info';
          const icon = L.icon({
            iconUrl: `https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-${color === 'danger' ? 'red' : color === 'warning' ? 'orange' : 'blue'}.png`,
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
            iconSize: [25, 41],
            iconAnchor: [12, 41],
            popupAnchor: [1, -34],
            shadowSize: [41, 41]
          });

          const marker = L.marker([reporte.lat, reporte.lng], { icon }).addTo(map);
          marker.bindPopup(`
            <div>
              <strong>${reporte.titulo}</strong><br>
              <small>${reporte.descripcion}</small><br>
              <span class="badge bg-${color}">${reporte.gravedad}</span>
            </div>
          `);
        });

        document.getElementById('reportCount').textContent = reportes.length;
      } catch (error) {
        console.error('Error cargando reportes:', error);
      }
    }

    // Cargar reportes al iniciar
    cargarReportes();

    // Botones
    document.getElementById('btnRefresh').addEventListener('click', cargarReportes);
    document.getElementById('btnCenter').addEventListener('click', () => {
      map.setView([40, -3], 6);
    });
  </script>
</body>
</html>
